spring.application.name=finapp-backend

spring.profiles.active=prod

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# jwt.secret is deliberately absent from this file — it is tracked in git.
# Set it in the untracked application-{dev,prod}.properties, or via the
# JWT_SECRET environment variable. Startup fails if it is missing, which is
# the intended behaviour.
jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG
logging.level.com.finapp.service.BankPdfParser=DEBUG
logging.file.name=app.log
