spring.application.name=finapp-backend

spring.profiles.active=dev

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# jwt.secret is deliberately absent from this file — it is tracked in git.
# Set it in the untracked application-{dev,prod}.properties, or via the
# JWT_SECRET environment variable. Startup fails if it is missing, which is
# the intended behaviour.
jwt.expiration=86400000

# Statements are uploaded whole, and Spring's default caps a file at 1MB.
# ICICI's credit card PDFs run 1.4-1.5MB, so every one of them was rejected
# before it reached the parser — and as a bodiless 403, because the failure
# forwards to /error, which carries no JWT and is refused as anonymous.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

logging.level.org.springframework.security=DEBUG
logging.level.com.finapp.service.BankPdfParser=DEBUG
logging.file.name=app.log
